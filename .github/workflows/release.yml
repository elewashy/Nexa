name: Release

on:
  release:
    types:
      - published
  push:
    tags:
      - v*

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Signed Android Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Android environment
        uses: ./.github/actions/setup-android-env

      - name: Validate changelog for app version
        run: bash scripts/changelog-version.sh validate

      - name: Prepare release notes from changelog
        run: bash scripts/changelog-version.sh extract release-notes.md

      - name: Prepare signing config
        uses: ./.github/actions/prepare-signing
        with:
          signing-key: ${{ secrets.SIGNING_KEY }}
          signing-key-alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          signing-key-password: ${{ secrets.SIGNING_KEY_PASSWORD }}
          signing-store-password: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Run unit tests and build signed release APK
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Collect release APK
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk release-artifacts/

      - name: Generate SHA-256 checksums
        run: |
          cd release-artifacts
          for apk in *.apk; do
            sha256sum "$apk" > "$apk.sha256"
          done
          sha256sum *.apk > checksums.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexa-release-apk
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          body_path: release-notes.md
          make_latest: true
