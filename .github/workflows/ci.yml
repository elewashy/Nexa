name: CI

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - gradle/**
      - gradle/libs.versions.toml
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradlew
      - gradlew.bat
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - .github/actions/**
      - CHANGELOG.md
      - scripts/**
  pull_request:
    paths:
      - app/**
      - gradle/**
      - gradle/libs.versions.toml
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradlew
      - gradlew.bat
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - .github/actions/**
      - CHANGELOG.md
      - scripts/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Android environment
        uses: ./.github/actions/setup-android-env

      - name: Validate changelog for app version
        run: bash scripts/changelog-version.sh validate

      - name: Run unit tests, assemble debug APK, and lint
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon --stacktrace

  release:
    name: Minified Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Signing secrets are unavailable on fork PRs; skip the signed release
    # build there (debug checks above still run).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Android environment
        uses: ./.github/actions/setup-android-env

      - name: Prepare signing config
        uses: ./.github/actions/prepare-signing
        with:
          signing-key: ${{ secrets.SIGNING_KEY }}
          signing-key-alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          signing-key-password: ${{ secrets.SIGNING_KEY_PASSWORD }}
          signing-store-password: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Assemble minified release APK and lint
        run: ./gradlew assembleRelease lintRelease --no-daemon --stacktrace
